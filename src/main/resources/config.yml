integrations:
  lands: true
  vault: true
  playerpoints: true
  playercurrency: true
  chunky: true
  chunky-border: true
  chunky-border-initial-shape: square
  allow-downgrade-when-provider-missing: true
economy-recommendation:
  baseline-vault-balance: 1000000
  minimum-multiplier: 1.0
  maximum-multiplier: 20.0
network:
  enabled: true
  server-id: server-1
  mysql:
    host: 127.0.0.1
    port: 3306
    database: bordergate
    username: bordergate
    password: bordergate
    use-ssl: false
  redis:
    enabled: true
    host: 127.0.0.1
    port: 6379
    password: ''
    channel: bordergate:updates
