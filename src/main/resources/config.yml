world: world
border:
  initial-size: 3000.0
  minimum-size: 1000.0
  # Initial/base ceiling; monthly tasks persist a multiplier in data.yml.
  maximum-size: 12000.0
  expand-by: 256.0
  shrink-by: 128.0
  transition-seconds: 30
  initial-center-x: 0.0
  initial-center-z: 0.0
# Defaults retain existing UTC midnight rollover. Shanghai 04:00: Asia/Shanghai / 4.
schedule:
  timezone: UTC
  rollover-hour: 0
  settle-on-completion: true
# No targets table is needed in automatic mode. Overrides below are optional.
automation:
  enabled: true
  daily-range-percent: 1.0
  weekly-range-percent: 4.0
  excluded-resources: []
# Cooperative guidance works without MCP or an external economy.
cooperation:
  enabled: true
  reminders:
    enabled: true
  adaptive:
    enabled: true

tasks:
  daily:
    enabled: true
    source: auto
    title: '&a每日边界维护'
    score-multiplier: 1.0
    target-multiplier: 1.0
    automatic-template: ''
    target-multipliers:
      'item:FEATHER': 0.3333333333333333
    # Optional; omit to use the selected built-in template's default.
    # automatic-required-count: 2
    border-transition-seconds: 30
    # Used only when source: manual (or automation.enabled: false).
    required-count: 2
    select-random: 0
    border-expand: 128.0
    border-shrink: 64.0
    targets:
      item:DIAMOND: 16
      vault: 1000
      playerpoints: 100
      playercurrency:coin: 50
    rewards:
      mode: pool
      per-player: 10
      amount-scale: 0
      # Optional currency command, e.g. playercurrency give {player} coin {amount}
      commands: []
  weekly:
    enabled: true
    source: auto
    title: '&6每周边界远征'
    score-multiplier: 3.0
    target-multiplier: 1.0
    automatic-template: ''
    target-multipliers: {}
    # Optional; omit to use the selected built-in template's default.
    # automatic-required-count: 3
    border-transition-seconds: 120
    # Manual-mode fallback only; automatic templates have their own conditions.
    required-count: 3
    select-random: 4
    border-expand: 512.0
    border-shrink: 256.0
    targets:
      item:DIAMOND: 128
      item:EMERALD: 256
      vault: 25000
      playerpoints: 1500
      playercurrency:coin: 1000
    rewards:
      mode: pool
      per-player: 50
      amount-scale: 0
      commands: []
  monthly:
    enabled: true
    source: auto
    title: '&d每月疆域建设'
    score-multiplier: 6.0
    target-multiplier: 1.0
    automatic-template: ''
    target-multipliers: {}
    # Optional; omit to keep the selected built-in template's default completion count.
    # automatic-required-count: 3
    # +/- percent of the current effective ceiling, NOT current border size.
    maximum-change-percent: 5.0
    border-transition-seconds: 120
    rewards:
      mode: pool
      per-player: 0
      amount-scale: 0
      commands: []
resources:
  # Optional display labels; item names otherwise follow the Minecraft client language.
  names:
    vault: '金币'
    playerpoints: '点券'
    playercurrency:coin: '金币'
  weights:
    item:DIAMOND: 1.0
    item:EMERALD: 0.7
    vault: 0.1
    playerpoints: 0.25
    playercurrency:coin: 0.2
gui:
  # NPC-first: console opens with `bordergate open <player>`; joining never opens by default.
  # If enabled, both bordergate.command and bordergate.use are required, including after delay.
  open-on-join: false
  deposit-amount: 1
